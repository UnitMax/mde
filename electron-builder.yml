appId: dev.mde.app
productName: mde
directories:
  output: dist
  buildResources: build
npmRebuild: false
# Electron's shipped fuse defaults leave the packaged binary usable as a
# general-purpose Node interpreter and leave app.asar unvalidated. MDE never
# re-executes itself as Node, so all of this is dead weight that only makes the
# build look like a living-off-the-land tool to endpoint protection.
# `grantFileProtocolExtraPrivileges` stays enabled: the renderer is loaded with
# `loadFile`, so it is a file:// page and still needs those privileges.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
files:
  - out/**
  - package.json
  - '!**/*.{ts,map,md}'
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
win:
  icon: build/icon.ico
  files:
    - out/**
    - package.json
    - '!**/*.{ts,map,md}'
    # node-pty ships Electron-compatible Windows prebuilds. Do not distribute
    # locally rebuilt objects, compiler logs, PDBs, sources, or other platforms.
    - '!node_modules/node-addon-api/**'
    - '!node_modules/node-pty/bin/**'
    - '!node_modules/node-pty/build/**'
    - '!node_modules/node-pty/deps/**'
    - '!node_modules/node-pty/lib/**/*.test.js'
    - '!node_modules/node-pty/lib/testUtils.test.js'
    - '!node_modules/node-pty/scripts/**'
    - '!node_modules/node-pty/src/**'
    - '!node_modules/node-pty/third_party/**'
    - '!node_modules/node-pty/prebuilds/darwin-*/**'
    - '!node_modules/node-pty/prebuilds/win32-arm64/**'
    - '!node_modules/node-pty/prebuilds/win32-x64/*.pdb'
    # node-pty only reaches for winpty below Windows build 18309, and its agent
    # works by scraping a hidden console's screen buffer, which is hard to tell
    # apart from console hijacking. MDE requires the ConPTY path, whose helper
    # binaries are Microsoft-signed, so ship neither the winpty binding nor its
    # runtime. This drops support for Windows 10 releases before 1903.
    - '!node_modules/node-pty/prebuilds/win32-x64/pty.node'
    - '!node_modules/node-pty/prebuilds/win32-x64/winpty.dll'
    - '!node_modules/node-pty/prebuilds/win32-x64/winpty-agent.exe'
  # Native modules and their companion executables cannot run from inside asar.
  asarUnpack:
    - '**/node_modules/node-pty/prebuilds/win32-x64/**'
  # A ZIP is the whole Windows release. An NSIS portable build re-extracts ~90 MB
  # into %TEMP% and executes from there on every launch, which is the generic
  # shape behavioral heuristics are written against, and an installer buys back
  # little of that while MDE has no code-signing certificate.
  target:
    - target: zip
      arch: [x64]
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  synopsis: Agentic dev environment
  syncDesktopName: true
  maintainer: UnitMax <105129888+UnitMax@users.noreply.github.com>
  artifactName: ${productName}-${version}.${ext}
