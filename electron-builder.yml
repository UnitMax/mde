appId: dev.mde.app
productName: mde
directories:
  output: dist
  buildResources: build
npmRebuild: false
files:
  - out/**
  - package.json
  - '!**/*.{ts,map,md}'
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
win:
  icon: build/icon.ico
  files:
    - out/**
    - package.json
    - '!**/*.{ts,map,md}'
    # node-pty ships Electron-compatible Windows prebuilds. Do not distribute
    # locally rebuilt objects, compiler logs, PDBs, sources, or other platforms.
    - '!node_modules/node-addon-api/**'
    - '!node_modules/node-pty/bin/**'
    - '!node_modules/node-pty/build/**'
    - '!node_modules/node-pty/deps/**'
    - '!node_modules/node-pty/lib/**/*.test.js'
    - '!node_modules/node-pty/lib/testUtils.test.js'
    - '!node_modules/node-pty/scripts/**'
    - '!node_modules/node-pty/src/**'
    - '!node_modules/node-pty/third_party/**'
    - '!node_modules/node-pty/prebuilds/darwin-*/**'
    - '!node_modules/node-pty/prebuilds/win32-arm64/**'
    - '!node_modules/node-pty/prebuilds/win32-x64/*.pdb'
  # Native modules and their companion executables cannot run from inside asar.
  asarUnpack:
    - '**/node_modules/node-pty/prebuilds/win32-x64/**'
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: mde
portable:
  artifactName: ${productName}-${version}-portable.${ext}
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  synopsis: Agentic dev environment
  syncDesktopName: true
  maintainer: UnitMax <105129888+UnitMax@users.noreply.github.com>
  artifactName: ${productName}-${version}.${ext}
