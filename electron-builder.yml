appId: dev.mde.app
productName: mde
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.{ts,map,md}'
# node-pty ships a .node binary; it cannot be loaded from inside an asar archive.
asarUnpack:
  - '**/node_modules/node-pty/**'
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: mde
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  synopsis: Agentic dev environment
  syncDesktopName: true
  maintainer: UnitMax <105129888+UnitMax@users.noreply.github.com>
  artifactName: ${productName}-${version}.${ext}
